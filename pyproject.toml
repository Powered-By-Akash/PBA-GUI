[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pba-gui"
version = "2025.1.0"
authors = [
  { name = "Akash Tanna", email = "Poweredbyakash@gmail.com" },
  { name = "Powered By Akash", email = "support@poweredbyakash.in" },
]
description = "Python Tkinter GUI Framework & Visual Component Library for PBA Desktop Applications & Engineering Systems"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: User Interfaces",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["tkinter", "gui", "desktop", "pba-gui", "visual-components", "python-ui"]

[project.urls]
"Homepage" = "https://github.com/Powered-By-Akash/PBA-GUI"
"Website" = "https://www.poweredbyakash.in/"
"Organization" = "https://github.com/Powered-By-Akash"
"Bug Tracker" = "https://github.com/Powered-By-Akash/PBA-GUI/issues"
